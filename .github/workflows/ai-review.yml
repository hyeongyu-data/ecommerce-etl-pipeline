name: AI PR Review

# Anthropic Claude(claude-code-action)로 PR을 리뷰한다.
# 심각도 순 요약 코멘트 + diff 라인에 "이해도 확인:" inline 코멘트.
# 필수 체크가 아니며, GUDOKPIN_API_KEY(Anthropic API 키) 시크릿이 없으면 조용히 건너뛴다.
# 재실행: PR 대화에 `/ai-review` 코멘트. 문서 전용 PR은 자동 트리거에서 제외.
# 모델은 아래 CLAUDE_MODEL 로 바꾼다.

env:
  CLAUDE_MODEL: claude-sonnet-5

on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 리뷰할 PR 번호
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/ai-review'))
    runs-on: ubuntu-latest
    steps:
      - name: 시크릿 확인
        id: guard
        env:
          KEY: ${{ secrets.GUDOKPIN_API_KEY }}
        run: |
          if [ -n "${KEY:-}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "GUDOKPIN_API_KEY 시크릿이 없어 AI 리뷰를 건너뜁니다."
            echo "등록: 저장소 Settings > Secrets and variables > Actions > GUDOKPIN_API_KEY"
          fi

      - name: Checkout
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude PR 리뷰
        if: steps.guard.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.GUDOKPIN_API_KEY }}
          trigger_phrase: "/ai-review"
          prompt: |
            이 저장소의 코드 리뷰어로서 아래 PR을 검토하십시오.

            Repository: ${{ github.repository }}
            PR number: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}

            언어는 한국어 격식체입니다. 저장소 규칙은 `.claude/docs/agent-peer-review.md` 를 따릅니다.

            발견 사항을 심각도 순으로 제시합니다:
            1. 정확성 버그, 기존 동작의 의도치 않은 변경
            2. 시크릿·자격 증명 노출
            3. 입력 검증 누락, 권한 확대
            4. 불필요한 복잡도·중복 (기존 코드로 대체 가능한지)
            5. 테스트 누락
            칭찬은 나열하지 않습니다. 각 발견에 파일·라인을 답니다.
            추측이 아니라 diff와 저장소 코드에 근거해서만 지적합니다.

            이해도 확인 (inline):
            - 이 PR의 핵심 로직에 대해 작성자가 답해야 하는 구체적 질문 1~3개를,
              diff의 가장 관련 있는 변경 라인에 inline 리뷰 코멘트로 답니다.
              최종 요약에만 넣지 마십시오.
            - 안전하게 소유·유지·운영하려면 반드시 이해해야 하는 로직만 묻습니다
              (동작 변경, 엣지 케이스, 실패 모드, 상태 전이, 데이터 계약, 롤백/운영 영향).
            - 일반적 베스트프랙티스 상식은 묻지 않습니다. 답은 코멘트에 쓰지 않습니다.
            - 각 inline 코멘트는 "이해도 확인:" 으로 시작합니다.
            - PR이 사소하거나 문서·포맷·기계적 변경이면 이해도 확인 코멘트를 달지 않습니다.

            마지막에 요약을 `gh pr comment` 로 PR 대화에 한 번 게시합니다.
            요약 끝에 다음 줄을 답니다:
            "Claude 자동 리뷰입니다. 필수 체크가 아니며 `/ai-review` 코멘트로 재실행할 수 있습니다."
          claude_args: |
            --model ${{ env.CLAUDE_MODEL }}
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
