name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 언어 무관 기본 검사 (pre-commit 훅: 공백/개행/YAML/시크릿 등)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1

      # TODO: 언어별 빌드/테스트 단계를 여기에 추가하세요.
      #   예) npm ci && npm test  /  go test ./...  /  cargo test  /  pytest
