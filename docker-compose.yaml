# 로컬 개발용 Airflow. 운영 배포용이 아니다.
# 기동:  docker compose up -d       (첫 실행은 이미지 빌드로 몇 분 소요)
# 웹 UI: http://localhost:8080  (airflow / airflow)
# 정리:  docker compose down -v
#
# 강의용 airflow-local 대비 단순화: LocalExecutor 채택으로 Celery/Redis 제거, MySQL 제거.
# dags·data·mock 만 호스트 바인드, logs/plugins 는 명명 볼륨.
# mock-openmarket: DAG 2가 호출하는 오픈마켓 API 목업(외부 의존 없이 HTTP 수집 시연).

name: ecommerce-etl-pipeline

x-airflow-common: &airflow-common
  build:
    context: .
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-2.10.3}
  image: ecommerce-etl-pipeline/airflow:${AIRFLOW_VERSION:-2.10.3}
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    TZ: Asia/Seoul
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Seoul
    ETL_DATA_DIR: ${ETL_DATA_DIR:-/opt/airflow/data}
    PG_QUALITY_MAX_VIOLATION_RATE: ${PG_QUALITY_MAX_VIOLATION_RATE:-0.01}
    OPENMARKET_API_BASE_URL: ${OPENMARKET_API_BASE_URL:-http://mock-openmarket:8000}
    OPENMARKET_QUALITY_MAX_VIOLATION_RATE: ${OPENMARKET_QUALITY_MAX_VIOLATION_RATE:-0.01}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # 오픈마켓(fakestore 형태) API 목업. DAG 2가 실제 HTTP로 호출한다.
  mock-openmarket:
    image: python:3.12-slim
    working_dir: /app
    command: python mock/openmarket_server.py --host 0.0.0.0 --port 8000
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./mock:/app/mock:ro
      - ./src:/app/src:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/products').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname airflow --lastname admin --role Admin \
          --email admin@example.com || true
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      mock-openmarket:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      mock-openmarket:
        condition: service_healthy

volumes:
  postgres-db:
  airflow-logs:
  airflow-plugins:
